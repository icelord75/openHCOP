; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[env:ATtiny44]
platform = atmelavr
board = attiny44
board_build.mcu = attiny44
board_build.f_cpu = 8000000L
build_flags = -Wno-comment

; lfuse 0x52: int RC Osc 8MHz, start-up 14CK+4ms, CKDIV8 programmed
;   (firmware switches the clock to full 8 MHz itself via CLKPR)
; hfuse 0xDD: SPI programming enabled, BOD 2.7V
; efuse 0xFF
board_fuses.lfuse = 0x52
board_fuses.hfuse = 0xDD
board_fuses.efuse = 0xFF

upload_protocol = usbtiny
;upload_protocol = avrisp
upload_flags = -P usb
; Fuses are written separately:  pio run -t fuses
